<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Forgot Password | Furni</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link rel="shortcut icon" href="favicon.png">
</head>
<body>
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="Furni navigation bar"><div class="container"><a class="navbar-brand" href="index.html">Furni<span>.</span></a></div></nav>
  <div class="untree_co-section"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5 mb-5 mb-lg-0">
    <div class="p-5 bg-white rounded shadow"><h2 class="section-title mb-4">Reset Password</h2><p class="mb-4">Enter your email address and we'll send you a link to reset your password.</p>
      <form id="forgotForm" class="mb-4" novalidate>
        <div class="form-group mb-4"><label for="email" class="form-label">Email address</label><input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" autocomplete="email" required><div class="invalid-feedback">Please provide a valid email address.</div></div>
        <div id="messageAlert" class="alert d-none mb-4" role="alert" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary w-100"><span class="btn-text">Send Reset Link</span><span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span></button>
      </form>
      <div class="text-center"><p class="mb-0">Remember your password? <a href="signin.html" class="text-primary">Sign in</a></p></div>
    </div>
  </div></div></div></div>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('forgotForm'), alertDiv = document.getElementById('messageAlert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); alertDiv.classList.add('d-none');
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
      const email = form.email.value.trim().toLowerCase();
      const btn = form.querySelector('button'), text = btn.querySelector('.btn-text'), spinner = btn.querySelector('.spinner-border');
      btn.disabled = true; text.classList.add('d-none'); spinner.classList.remove('d-none');
      try {
        const response = await fetch('http://localhost:3001/api/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Unable to process the request.');
        showAlert(data.message || 'If an account exists, a reset link has been sent.', 'success');
        form.reset(); form.classList.remove('was-validated');
      } catch (error) { showAlert(error.message || 'An error occurred. Please try again.', 'danger'); }
      finally { btn.disabled = false; text.classList.remove('d-none'); spinner.classList.add('d-none'); }
    });
    function showAlert(message, type) { alertDiv.textContent = message; alertDiv.className = `alert alert-${type} mb-4`; }
  </script>
</body>
</html>
