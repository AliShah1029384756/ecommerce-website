<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Reset Password | Furni</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link rel="shortcut icon" href="favicon.png">
  <style>.password-input-group{position:relative}.password-toggle{cursor:pointer;position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:5}.strength-meter{height:5px;margin-top:5px;background:#e9ecef;border-radius:3px;overflow:hidden}.strength-meter-fill{height:100%;width:0%;transition:width .3s ease}.strength-text{font-size:.8rem;margin-top:3px}</style>
</head>
<body>
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="Furni navigation bar"><div class="container"><a class="navbar-brand" href="index.html">Furni<span>.</span></a></div></nav>
  <div class="untree_co-section"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5 mb-5 mb-lg-0">
    <div class="p-5 bg-white rounded shadow"><h2 class="section-title mb-4">Reset Your Password</h2>
      <form id="resetPasswordForm" novalidate>
        <input type="hidden" id="email" name="email"><input type="hidden" id="token" name="token">
        <div class="form-group mb-3"><label for="newPassword" class="form-label">New Password</label><div class="password-input-group"><input type="password" class="form-control" id="newPassword" name="newPassword" autocomplete="new-password" required minlength="8"><span class="password-toggle" role="button" tabindex="0" onclick="togglePassword('newPassword')"><i class="far fa-eye"></i></span></div><div class="strength-meter"><div class="strength-meter-fill" id="passwordStrength"></div></div><small class="strength-text" id="passwordStrengthText"></small><div class="invalid-feedback">Password must be at least 8 characters.</div></div>
        <div class="form-group mb-4"><label for="confirmPassword" class="form-label">Confirm Password</label><div class="password-input-group"><input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" required minlength="8"><span class="password-toggle" role="button" tabindex="0" onclick="togglePassword('confirmPassword')"><i class="far fa-eye"></i></span></div><div class="invalid-feedback">Passwords must match.</div></div>
        <div id="formAlert" class="alert d-none mb-4" role="alert" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary w-100"><span class="submit-text">Reset Password</span><span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span></button>
      </form>
      <div class="text-center mt-3"><p class="mb-0">Remember your password? <a href="signin.html" class="text-primary">Sign in</a></p></div>
    </div>
  </div></div></div></div>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search), email = params.get('email'), token = params.get('token'), form = document.getElementById('resetPasswordForm');
    if (!email || !token) { showAlert('Invalid or incomplete password reset link.', 'danger'); form.style.display='none'; }
    else { document.getElementById('email').value=email; document.getElementById('token').value=token; }
    document.getElementById('newPassword').addEventListener('input', e => updatePasswordStrength(e.target.value));
    form.addEventListener('submit', async e => {
      e.preventDefault(); const alertDiv=document.getElementById('formAlert'); alertDiv.classList.add('d-none');
      const newPassword=form.newPassword.value, confirmPassword=form.confirmPassword.value;
      form.confirmPassword.setCustomValidity(newPassword===confirmPassword?'':"Passwords don't match");
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
      const btn=form.querySelector('button[type="submit"]'), text=btn.querySelector('.submit-text'), spinner=btn.querySelector('.spinner-border'); btn.disabled=true;text.classList.add('d-none');spinner.classList.remove('d-none');
      try {
        const response=await fetch('http://localhost:3001/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,token:form.token.value,newPassword})});
        const data=await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.message||'Failed to reset password.');
        showAlert(data.message||'Password reset successfully! Redirecting to login...','success'); setTimeout(()=>window.location.href='signin.html',700);
      } catch(error) { showAlert(error.message||'An error occurred while resetting your password.','danger'); }
      finally { btn.disabled=false;text.classList.remove('d-none');spinner.classList.add('d-none'); }
    });
    function togglePassword(id){const input=document.getElementById(id),icon=input.parentElement.querySelector('i');input.type=input.type==='password'?'text':'password';icon.classList.toggle('fa-eye');icon.classList.toggle('fa-eye-slash');}
    function updatePasswordStrength(password){const bar=document.getElementById('passwordStrength'),label=document.getElementById('passwordStrengthText');let s=0;if(password.length>=8)s++;if(/\d/.test(password))s++;if(/[!@#$%^&*(),.?":{}|<>]/.test(password))s++;if(/[A-Z]/.test(password))s++;if(/[a-z]/.test(password))s++;const levels=[['Very Weak',20,'danger'],['Weak',40,'warning'],['Moderate',60,'info'],['Strong',80,'primary'],['Very Strong',100,'success']];const [text,width,color]=levels[Math.max(0,s-1)]||['',0,'danger'];bar.style.width=width+'%';bar.style.backgroundColor=`var(--bs-${color})`;label.textContent=password?text:'';label.className=`strength-text text-${color}`;}
    function showAlert(message,type){const box=document.getElementById('formAlert');box.textContent=message;box.className=`alert alert-${type} mb-4`;}
  </script>
</body>
</html>
