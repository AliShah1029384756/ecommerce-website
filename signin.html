<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Sign In | Furni</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.png">
</head>
<body>
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="Furni navigation bar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Furni<span>.</span></a>
    </div>
  </nav>

  <div class="untree_co-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 mb-5 mb-lg-0">
          <div class="p-5 bg-white rounded shadow">
            <h2 class="section-title mb-4">Sign In</h2>
            <form id="signinForm" class="mb-4" novalidate>
              <div class="form-group mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
              </div>
              <div class="form-group mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Your password" autocomplete="current-password" required minlength="8">
              </div>
              <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember" name="remember">
                  <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="forgot.html" class="text-primary">Forgot password?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <div id="messageAlert" class="alert d-none" role="alert" aria-live="polite"></div>
            <div class="text-center">
              <p class="mb-0">Don't have an account? <a href="signup.html" class="text-primary">Sign up</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('signinForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const form = e.target;
      const alertDiv = document.getElementById('messageAlert');
      const submitBtn = form.querySelector('button[type="submit"]');
      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;

      alertDiv.classList.add('d-none');

      if (!email || !password) {
        showAlert('Please fill in all fields.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';

      try {
        const response = await fetch('http://localhost:3001/api/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || 'Failed to sign in.');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showAlert('Sign in successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = data.redirect || 'index.html';
        }, 700);
      } catch (error) {
        showAlert(error.message || 'An error occurred during sign in.', 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    function showAlert(message, type) {
      const alertDiv = document.getElementById('messageAlert');
      alertDiv.textContent = message;
      alertDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
      alertDiv.classList.add(`alert-${type}`);
    }
  </script>
</body>
</html>
