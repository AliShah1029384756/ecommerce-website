<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Sign Up | Furni</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.png">
</head>
<body>
  <div class="alert-container position-fixed top-0 end-0 p-3" style="z-index:9999;max-width:380px;width:100%;">
    <div id="customAlert" class="alert d-none" role="alert" aria-live="polite"></div>
  </div>

  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="Furni navigation bar">
    <div class="container"><a class="navbar-brand" href="index.html">Furni<span>.</span></a></div>
  </nav>

  <div class="untree_co-section">
    <div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-6 mb-5 mb-lg-0">
      <div class="p-5 bg-white rounded shadow">
        <h2 class="section-title mb-4">Create Account</h2>
        <form id="signupForm" class="mb-4" novalidate>
          <div class="row">
            <div class="col-md-6 mb-3"><label for="first-name" class="form-label">First Name</label><input type="text" class="form-control" id="first-name" autocomplete="given-name" required></div>
            <div class="col-md-6 mb-3"><label for="last-name" class="form-label">Last Name</label><input type="text" class="form-control" id="last-name" autocomplete="family-name"></div>
          </div>
          <div class="form-group mb-3"><label for="email" class="form-label">Email address</label><input type="email" class="form-control" id="email" autocomplete="email" required></div>
          <div class="form-group mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" autocomplete="new-password" required minlength="8"><small class="form-text text-muted">Minimum 8 characters</small></div>
          <div class="form-group mb-4"><label for="confirm-password" class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirm-password" autocomplete="new-password" required minlength="8"></div>
          <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">I agree to the Terms of Service and Privacy Policy.</label></div>
          <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
        </form>
        <div class="text-center"><p class="mb-0">Already have an account? <a href="signin.html" class="text-primary">Sign in</a></p></div>
      </div>
    </div></div></div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const alertBox = document.getElementById('customAlert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const terms = document.getElementById('terms').checked;
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
      if (password !== confirmPassword) { showAlert('Passwords do not match.', 'danger'); return; }
      if (!terms) { showAlert('You must agree to the terms and conditions.', 'danger'); return; }
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating account...';
      try {
        const response = await fetch('http://localhost:3001/api/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({firstName,lastName,email,password,confirmPassword}) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Failed to sign up.');
        showAlert('Account created successfully! Redirecting to login...', 'success');
        setTimeout(() => { window.location.href = 'signin.html'; }, 700);
      } catch (error) {
        showAlert(error.message || 'An error occurred during registration.', 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      setTimeout(() => alertBox.classList.add('d-none'), 5000);
    }
  </script>
</body>
</html>
